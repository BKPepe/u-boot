# Local testing helper, not for submission upstream.
#
# doc/develop/ci_testing.rst allows trimming the CI down to the jobs you care
# about for your own testing cycle, as long as it is not sent with the patches.
# U-Boot ships no GitHub Actions, so this file only ever lives on this fork's
# master and never on a series branch.
#
# It runs the same world build the Azure pipeline runs for the powerpc slice:
# the same container image, the same buildman invocation.
name: powerpc world build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'turris-fixes'

jobs:
  build_powerpc:
    name: 'buildman powerpc'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: trini/u-boot-gitlab-ci-runner:noble-20251013-23Jan2026
      options: -u 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Build every powerpc board
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          # board/qualcomm/requirements.txt only exists from the next
          # branch onwards, so take whatever this ref actually has.
          reqs=""
          for f in tools/binman/requirements.txt \
                   tools/buildman/requirements.txt \
                   board/qualcomm/requirements.txt; do
              if [ -f "$f" ]; then reqs="$reqs -r $f"; fi
          done
          echo "installing:$reqs"
          pip install $reqs setuptools
          # tools/docker/Dockerfile writes ~/.buildman as the "uboot" user,
          # so it lands in /home/uboot. GitHub runs container steps with
          # HOME=/github/home, where buildman would not find it and reports
          # "No tool chain found for arch 'powerpc'".
          if [ ! -f "$HOME/.buildman" ]; then
              if [ -f /home/uboot/.buildman ]; then
                  cp /home/uboot/.buildman "$HOME/.buildman"
              else
                  printf '[toolchain]\nkernelorg = /opt/gcc-*-nolibc/*\nroot = /usr\n' > "$HOME/.buildman"
              fi
          fi
          echo "--- buildman config ---"
          cat "$HOME/.buildman"
          echo "-----------------------"
          ret=0
          tools/buildman/buildman -o /tmp -PEWM powerpc || ret=$?
          if [ $ret -ne 0 ]; then
              echo "::group::buildman summary"
              tools/buildman/buildman -o /tmp -seP powerpc || true
              echo "::endgroup::"
              exit $ret
          fi
          tools/buildman/buildman -o /tmp -sP powerpc || true
